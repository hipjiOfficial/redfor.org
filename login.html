<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/assets/css/global.css">

</head>
<script src="/assets/js/version.js" defer></script>
<script src="/assets/js/audio.js" defer></script>
<script src="/assets/js/core.js" defer></script>
<script src="/assets/js/typing.js" defer></script>
<script src="/assets/js/login.js" defer></script>
<body>
    <header>
        <label class="burger" for="burger">
            <input type="checkbox" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </label>
    <div class="menu-card" id="menu">
      <a href="/">Home</a>
      <a href="/shop">Daily Shop</a>
      <a href="/gallery">Gallery</a>
      <a href="/about">About</a>
      <a href="/support">Support</a>
      <a href="/login">Log In</a>
    </div>
    <h4 class="titlepath" id="typed-text" data-text="agent@framework:/usr/login"></h4>
  </header>
    <div class="login-content">
        <h2>Log into your redfor.org account</h2>
        <div class="account-box">
        <form action="/login" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" class="expand" maxlength="25" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" class="expand" required>
            <br>
            <button type="submit">Log In</button>
        </form>
        <p id="message">Don't have an account? <a href="/signup">Sign up here</a>.</p>
        </div>
<footer>
